name: Release

# Runtime-first rollout:
# 1. Pass local Nakama integration and recovery (nakama-live).
# 2. Apply production API migrations, then deploy Nakama, API, and web
#    from the repository root. Nakama's Railway rootDirectory is
#    infra/nakama — uploading that folder alone fails the metal builder.
# 3. Publish npm packages and the Kotlin Maven artifact in parallel.
# 4. Verify Swift and Unity from the public tag without waiting for Maven.
# 5. Create the GitHub release after npm + Swift + Unity + production deploys.
# 6. Kotlin/Maven Central verification continues independently after publish.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  nakama-live:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require live runtime before package publish
        run: |
          npm run nakama:up
          npm run test:nakama
      - if: always()
        run: npm run nakama:down

  publish-npm:
    needs: [nakama-live]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify tag and package versions
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          const expected = process.env.GITHUB_REF_NAME.slice(1);
          const files = [
            "packages/protocol/package.json",
            "packages/sdk-js/package.json",
            "packages/ui-web/package.json",
            "packages/mcp/package.json",
            "packages/cli/package.json",
            "clients/unity/package.json",
          ];
          for (const file of files) {
            const value = JSON.parse(readFileSync(file, "utf8"));
            if (value.version !== expected) {
              throw new Error(`${file} is ${value.version}, expected ${expected}`);
            }
          }
          EOF
      - run: npm run check
      - name: Publish npm packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          publish_ws() {
            local workspace="$1"
            local name="$2"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published"
              return 0
            fi
            npm publish --workspace "$workspace" --access public --provenance
          }
          publish_ws @lokiplay/protocol @lokiplay/protocol
          publish_ws @lokiplay/sdk @lokiplay/sdk
          publish_ws @lokiplay/ui-web @lokiplay/ui-web
          publish_ws @lokiplay/mcp @lokiplay/mcp
          publish_ws lokiplay lokiplay
      - name: Verify public registry installation
        run: |
          version="${GITHUB_REF_NAME#v}"
          export LOKI_REGISTRY_PACKAGE_SPECS="[\"@lokiplay/protocol@$version\",\"@lokiplay/sdk@$version\",\"@lokiplay/ui-web@$version\",\"@lokiplay/mcp@$version\",\"lokiplay@$version\"]"
          for attempt in $(seq 1 20); do
            if npx tsx scripts/package-install-smoke.ts --registry; then
              exit 0
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "npm registry did not expose ${version} packages in time"
              exit 1
            fi
            echo "registry smoke failed; waiting for npm propagation (attempt ${attempt}/20)"
            sleep 30
          done

  publish-kotlin:
    needs: [nakama-live]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Verify tag version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -F "version = \"$version\"" clients/kotlin/build.gradle.kts
      - name: Test and publish signed Maven package
        env:
          MAVEN_REPOSITORY_URL: ${{ secrets.MAVEN_REPOSITORY_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: gradle --project-dir clients/kotlin test publish
      - name: Upload staging repository to Central Portal
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          token="$(printf '%s:%s' "$MAVEN_USERNAME" "$MAVEN_PASSWORD" | base64 | tr -d '\n')"
          auth_header="Authorization: Bearer ${token}"
          upload_default() {
            curl -sS -X POST \
              -H "$auth_header" \
              -H "Content-Type: application/json" \
              -w '\nHTTP %{http_code}\n' \
              "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/cc.lokiplay?publishing_type=automatic"
          }
          body="$(upload_default)"
          echo "$body"
          if echo "$body" | grep -q 'HTTP 20'; then
            exit 0
          fi
          repos="$(curl -sS -H "$auth_header" \
            'https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?ip=any&profile_id=cc.lokiplay')"
          echo "$repos"
          key="$(printf '%s' "$repos" | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              const data = JSON.parse(raw);
              const repo = (data.repositories || []).find((item) => item.state === "open" || item.state === "closed");
              if (!repo) process.exit(2);
              process.stdout.write(repo.key);
            });
          ')"
          curl -fsS -X POST \
            -H "$auth_header" \
            -H "Content-Type: application/json" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/repository/${key}?publishing_type=automatic"

  verify-swift:
    needs: [nakama-live]
    runs-on: macos-latest
    environment: release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Swift package from the public tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          export LOKI_PACKAGE_VERSION="$version"
          npx tsx scripts/verify-native-registry-install.ts --ecosystem swift

  verify-unity:
    needs: [nakama-live]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Unity package from the public tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          export LOKI_PACKAGE_VERSION="$version"
          npx tsx scripts/verify-native-registry-install.ts --ecosystem unity

  verify-kotlin:
    needs: [publish-kotlin]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: npm ci
      - name: Wait for Maven Central and verify the Kotlin package
        run: |
          version="${GITHUB_REF_NAME#v}"
          export LOKI_PACKAGE_VERSION="$version"
          for attempt in $(seq 1 40); do
            if curl -fsS "https://repo1.maven.org/maven2/cc/lokiplay/loki-sdk/${version}/loki-sdk-${version}.pom" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "Maven Central did not publish loki-sdk ${version} in time"
              exit 1
            fi
            sleep 90
          done
          npx tsx scripts/verify-native-registry-install.ts --ecosystem kotlin

  deploy-production:
    needs: [nakama-live]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      # Workspace/account tokens must be RAILWAY_API_TOKEN. RAILWAY_TOKEN is
      # only for project tokens and returns Unauthorized for this secret.
      - name: Apply production API migrations
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --service api \
            --project e59d29d4-a7f0-4d4f-a082-3097f31a0c3a \
            --environment production \
            -- npm run db:migrate
      - name: Deploy Nakama from the repository root
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service nakama --ci --yes \
            --project e59d29d4-a7f0-4d4f-a082-3097f31a0c3a \
            --environment production
      - name: Deploy API
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service api --ci --yes \
            --project e59d29d4-a7f0-4d4f-a082-3097f31a0c3a \
            --environment production
      - name: Deploy web with the released package versions
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service web --ci --yes \
            --project e59d29d4-a7f0-4d4f-a082-3097f31a0c3a \
            --environment production

  github-release:
    needs: [publish-npm, verify-swift, verify-unity, deploy-production]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag

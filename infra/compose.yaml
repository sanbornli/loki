services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: local-phase-zero
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakama"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - nakama-data:/var/lib/postgresql/data

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.22.0
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up
        --database.address nakama:local-phase-zero@postgres:5432/nakama &&
        exec /nakama/nakama
        --name loki-phase-zero
        --database.address nakama:local-phase-zero@postgres:5432/nakama
        --config /nakama/data/local.yml
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:7349:7349"
      - "127.0.0.1:7350:7350"
      - "127.0.0.1:7351:7351"
    volumes:
      - ./nakama:/nakama/data:ro

volumes:
  nakama-data:

# Coturn configuration for turn.lokiplay.cc (Singapore).
#
# The shared secret is intentionally NOT set here. Pass the same value that
# Railway's Nakama service has as LOKI_TURN_SECRET on the turnserver command
# line instead, so the secret never lands in a file on disk or in git:
#
#   turnserver -c /etc/coturn/turnserver.conf --static-auth-secret="$LOKI_TURN_SECRET"
#
# Nakama's loki_turn_credentials RPC (infra/nakama/modules/loki.js) mints a
# short-lived username/password pair from that same secret using the
# coturn REST API convention (HMAC-SHA1 of a unix-timestamp username,
# base64-encoded). This file only needs use-auth-secret to accept them.

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0
# Replace with the VM's public IPv4 (coturn needs to advertise a real
# routable address in relay candidates, not a private/NAT address).
external-ip=203.0.113.10

# A relay allocation opens one UDP port per active connection from this
# range. Open (and document, per the plan) exactly this range in the VM's
# firewall alongside 3478/udp, 3478/tcp, and 5349/tcp.
min-port=49152
max-port=49452

realm=lokiplay.cc
server-name=turn.lokiplay.cc

# HMAC-SHA1 time-limited credentials only; no long-term user accounts.
use-auth-secret
no-cli

# TLS material for the turns:// listener (5349). Renew alongside any other
# certificate for turn.lokiplay.cc.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

fingerprint
stale-nonce=600
no-multicast-peers
no-loopback-peers

# Never let this public relay reach another host's private network (SSRF
# hardening recommended for any internet-facing TURN server).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

log-file=stdout

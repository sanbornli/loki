project_id = "lokiplay"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 16

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://play.lokiplay.cc/creator"
additional_redirect_urls = [
  "https://play.lokiplay.cc/creator",
  "https://play.lokiplay.cc/creator/**",
  "http://127.0.0.1:3000/**",
  "http://localhost:3000/**"
]
enable_signup = true
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.external.github]
enabled = false
